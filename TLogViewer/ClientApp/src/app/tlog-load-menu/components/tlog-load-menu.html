<app-spinner [visible]="uploading()" [message]="'upload.uploadingFile' | translate" />

<div class="tlog-load">
  <button
    type="button"
    class="tlog-load__toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-haspopup="menu"
    aria-controls="tlog-load-popup"
    [attr.aria-label]="(menuOpen() ? 'upload.closeMenu' : 'upload.openMenu') | translate"
  >
    {{ 'upload.uploadLog' | translate }}
  </button>

  @if (menuOpen()) {
    <div
      id="tlog-load-popup"
      class="tlog-load__popup"
      role="menu"
      [attr.aria-label]="'upload.loadTlog' | translate"
    >
      <p class="tlog-load__title">{{ 'upload.tlogFile' | translate }}</p>

      <button type="button" class="tlog-load__action" role="menuitem" (click)="openFilePicker()">
        {{ 'upload.chooseFile' | translate }}
      </button>

      <label class="tlog-load__option">
        <input
          type="checkbox"
          [checked]="splitIntoFlights()"
          (change)="onSplitIntoFlightsChange($event)"
        />
        <span>{{ 'upload.splitIntoFlights' | translate }}</span>
      </label>

      @if (selectedFile(); as file) {
        <p class="tlog-load__file" [title]="file.name">{{ file.name }}</p>
        <button
          type="button"
          class="tlog-load__action tlog-load__action--primary"
          role="menuitem"
          (click)="uploadSelected()"
          [disabled]="uploading()"
        >
          {{ (uploading() ? 'upload.uploading' : 'upload.uploadToServer') | translate }}
        </button>
      }
    </div>
  }

  <input
    #fileInput
    type="file"
    class="tlog-load__input"
    accept=".tlog,application/octet-stream"
    (change)="onFileSelected($event)"
  />
</div>
